name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Testes
        run: flutter test

      - name: App de iPhone (sem assinatura)
        run: flutter build ios --release --no-codesign

      - name: App para o simulador
        run: flutter build ios --simulator --debug

      - name: Abrir no iPhone simulado
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)['devices']
          phones = [d for runtime, ds in data.items() if 'iOS' in runtime for d in ds if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'])
          ")
          echo "Simulador: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl privacy "$UDID" grant location br.curso.app.curso || true
          xcrun simctl location "$UDID" set -22.0620,-46.9655 || true
          xcrun simctl install "$UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl launch "$UDID" br.curso.app.curso
          sleep 25
          mkdir -p prints
          xcrun simctl io "$UDID" screenshot prints/iphone-home.png
          xcrun simctl spawn "$UDID" launchctl list | grep -q br.curso.app.curso && echo "App aberto e rodando"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prints-iphone
          path: prints/
